AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: IoTMonSys Lambda Functions with Shared Layer

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [ dev, stage, prod ]

  MongoDbUri:
    Type: String
    Description: MongoDB connection URI
    NoEcho: true
    Default: mongodb://localhost:27017

  MongoDbName:
    Type: String
    Description: MongoDB database name

  JwtSecret:
    Type: String
    Description: Secret key for JWT token generation
    NoEcho: true
    Default: secret

  SnsTopicArn:
    Type: String
    Description: ARN of the SNS topic for notifications

  ApiEndpointParameterName:
    Type: String
    Default: /iotmonsys/api-endpoint
    Description: Name of the SSM parameter to store the API endpoint URL
    
  KinesisStreamName:
    Type: String
    Default: IoTMonSys-DeviceData
    Description: Name of the Kinesis Data Stream for device data
    
  SmsEnabled:
    Type: String
    Default: "false"
    AllowedValues: [ "true", "false" ]
    Description: Enable SMS notifications for anomaly alerts
    
  SmsPhoneNumber:
    Type: String
    Default: ""
    Description: Phone number for SMS notifications (with country code, e.g. +375296523901)

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: java21
    Architectures:
      - x86_64
    Environment:
      Variables:
        STAGE: !Ref Stage
        MONGODB_URI: !Ref MongoDbUri
        MONGODB_DB: !Ref MongoDbName
        JWT_SECRET: !Ref JwtSecret
        SNS_TOPIC_ARN: !Ref SnsTopicArn
        API_ENDPOINT_PARAMETER: !Ref ApiEndpointParameterName
    CodeUri: ./shared-dependencies/target/shared-dependencies-1.0-SNAPSHOT.jar

Resources:
  # Shared Dependencies Layer
  SharedDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub iotmonsys-${Stage}-shared-dependencies
      Description: Shared dependencies for all IoTMonSys Lambda functions
      ContentUri: ./shared-dependencies/target/shared-dependencies-1.0-SNAPSHOT-lambda-layer.zip
      CompatibleRuntimes:
        - java21
      RetentionPolicy: Retain

  # Serverless API Gateway
  IoTMonSysApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      TracingEnabled: true

  # Lambda Functions
  ApproveBlockRemoveDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub iotmonsys-${Stage}-approve-block-remove-device
      Description: Handles device approval, blocking, and removal operations
      Handler: optdev.iotmonsys.lambdas.ApproveBlockRemoveDeviceHandler::handleRequest
      Role: arn:aws:iam::394163297125:role/service-role/IOTMonSys_Lambda_Permissions
      Layers:
        - !Ref SharedDependenciesLayer
      Events:
        ApproveDevice:
          Type: Api
          Properties:
            Path: /devices/{deviceId}/approve
            Method: get
            RestApiId: !Ref IoTMonSysApi
        BlockDevice:
          Type: Api
          Properties:
            Path: /devices/{deviceId}/block
            Method: get
            RestApiId: !Ref IoTMonSysApi
        RemoveDevice:
          Type: Api
          Properties:
            Path: /devices/{deviceId}/remove
            Method: get
            RestApiId: !Ref IoTMonSysApi

  DeviceAddedEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub iotmonsys-${Stage}-device-added-event
      Description: Handles new device added event
      Handler: optdev.iotmonsys.lambdas.DeviceAddedEventHandler::handleRequest
      Role: arn:aws:iam::394163297125:role/service-role/IOTMonSys_Lambda_Permissions
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Ref ApiEndpointParameterName
      Layers:
        - !Ref SharedDependenciesLayer
      Environment:
        Variables:
          SMS_ENABLED: !Ref SmsEnabled
          SMS_PHONE_NUMBER: !Ref SmsPhoneNumber
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /devices
            Method: post
            RestApiId: !Ref IoTMonSysApi

  DataProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub iotmonsys-${Stage}-data-processor
      Description: Processes device data from Kinesis stream, detects anomalies and sends alerts
      Handler: optdev.iotmonsys.lambdas.DataProcessorHandler::handleRequest
      Role: arn:aws:iam::394163297125:role/service-role/IOTMonSys_Lambda_Permissions
      Layers:
        - !Ref SharedDependenciesLayer
      Environment:
        Variables:
          ANOMALY_DETECTION_ENABLED: "true"
          SMS_ENABLED: !Ref SmsEnabled
          SMS_PHONE_NUMBER: !Ref SmsPhoneNumber
      Events:
        KinesisEvent:
          Type: Kinesis
          Properties:
            Stream: !Sub arn:aws:kinesis:${AWS::Region}:${AWS::AccountId}:stream/${KinesisStreamName}
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 10

  ErrorPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub iotmonsys-${Stage}-error-poller
      Description: Monitors devices for offline status and low battery levels
      Handler: optdev.iotmonsys.lambdas.ErrorPollerHandler::handleRequest
      Role: arn:aws:iam::394163297125:role/service-role/IOTMonSys_Lambda_Permissions
      Layers:
        - !Ref SharedDependenciesLayer
      Environment:
        Variables:
          MONGODB_DB: !Ref MongoDbName
          SNS_TOPIC_ARN: !Ref SnsTopicArn
          SMS_ENABLED: !Ref SmsEnabled
          SMS_PHONE_NUMBER: !Ref SmsPhoneNumber
      Events:
        ScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Name: !Sub iotmonsys-${Stage}-error-poller-schedule
            Description: Runs the error poller every hour
            Enabled: true

  # ApiEndpoint URL
  ApiEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Ref ApiEndpointParameterName
      Type: String
      Value: !Sub "https://${IoTMonSysApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"
      Description: IoTMonSys API Gateway endpoint URL

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${IoTMonSysApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"
  
  DeviceAddedEventFunction:
    Description: "Device Added Event Lambda Function ARN"
    Value: !GetAtt DeviceAddedEventFunction.Arn
  
  ApproveBlockRemoveDeviceFunction:
    Description: "Approve/Block/Remove Device Lambda Function ARN"
    Value: !GetAtt ApproveBlockRemoveDeviceFunction.Arn
  
  DataProcessorFunction:
    Description: "Data Processor Lambda Function ARN"
    Value: !GetAtt DataProcessorFunction.Arn
  
  ErrorPollerFunction:
    Description: "Error Poller Lambda Function ARN"
    Value: !GetAtt ErrorPollerFunction.Arn
  
  SharedDependenciesLayer:
    Description: "Shared Dependencies Layer ARN"
    Value: !Ref SharedDependenciesLayer
